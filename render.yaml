services:
  - type: web
    name: sap-support
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    disk:
      name: sap-support-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HELPDESK_DB
        value: /var/data/helpdesk.db
      - key: HELPDESK_UPLOADS
        value: /var/data/uploads
      - key: HELPDESK_NAME
        value: SoftClinch AMS Desk
      - key: HELPDESK_TZ
        value: Asia/Kolkata
      - key: HELPDESK_SECRET_KEY
        generateValue: true