{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="panel"><div class="body">
  <h1>{{ code }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div></div>
{% endblock %}
{% block auth %}
<div class="card"><h1>{{ code }}</h1><p>{{ message }}</p><a class="btn" href="{{ url_for('login') }}">Sign in</a></div>
{% endblock %}
