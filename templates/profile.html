{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<form class="panel" method="post" style="max-width:440px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="body stack" style="gap:12px">
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required></div>
    <div class="field"><label for="new">New password</label><input id="new" name="new" type="password" minlength="8" required></div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" minlength="8" required></div>
    <div><button class="btn primary" type="submit">Change password</button></div>
  </div>
</form>
{% endblock %}
